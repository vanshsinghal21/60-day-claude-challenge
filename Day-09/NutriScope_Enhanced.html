
<!--
ENHANCED NUTRISCOPE FEATURES ADDED
- CSV Upload Support
- 40+ Additional Foods Dataset Placeholder
- Additional Micronutrients (Magnesium, Potassium, Zinc, Folate, Vitamin A, Vitamin E, Vitamin K)
- 2-Day Meal Planner Section
- Risk Analysis Engine Section
- Educational Disclaimer
- Nutrition Sources Section
- Better Charts Support (Bar, Radar, Trend)
- Advanced Recommendations Engine
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriScope</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--card2:#111827;
--text:#f8fafc;
--muted:#94a3b8;
--accent:#22c55e;
--danger:#ef4444;
--warning:#f59e0b;
--border:#334155;
}
*{box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{
margin:0;
background:linear-gradient(135deg,#020617,#0f172a);
color:var(--text);
padding:20px;
}
h1,h2,h3{margin:0 0 10px}
.container{
max-width:1400px;
margin:auto;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:18px;
}
.card{
background:rgba(30,41,59,.9);
border:1px solid var(--border);
border-radius:18px;
padding:18px;
backdrop-filter:blur(8px);
box-shadow:0 10px 30px rgba(0,0,0,.25);
}
input,select,button{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid var(--border);
background:#0f172a;
color:white;
}
button{
cursor:pointer;
background:var(--accent);
border:none;
font-weight:600;
}
button:hover{opacity:.92}
.row{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
margin-bottom:10px;
}
table{
width:100%;
border-collapse:collapse;
font-size:14px;
}
th,td{
padding:8px;
border-bottom:1px solid var(--border);
text-align:center;
}
.progress{
height:16px;
background:#111827;
border-radius:20px;
overflow:hidden;
}
.progress-fill{
height:100%;
background:linear-gradient(90deg,#22c55e,#10b981);
width:0%;
}
.metric{
display:flex;
justify-content:space-between;
margin:6px 0;
}
.badge{
padding:4px 10px;
border-radius:999px;
font-size:12px;
}
.low{background:#7f1d1d}
.high{background:#78350f}
.good{background:#14532d}
.small{font-size:13px;color:var(--muted)}
ul{padding-left:18px}
canvas{max-height:300px}
</style>
</head>
<body>

<div class="container">
<h1>🥗 NutriScope</h1>
<p class="small">Nutrition Intelligence Dashboard</p>

<div class="grid">

<div class="card">
<h2>Profile</h2>

<div class="row">
<input type="number" id="age" placeholder="Age" value="24">
<select id="gender">
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="row">
<input type="number" id="height" placeholder="Height cm" value="170">
<input type="number" id="weight" placeholder="Weight kg" value="70">
</div>

<div class="row">
<select id="activity">
<option value="1.2">Sedentary</option>
<option value="1.375">Light</option>
<option value="1.55" selected>Moderate</option>
<option value="1.725">Active</option>
<option value="1.9">Very Active</option>
</select>

<select id="diet">
<option>Vegetarian</option>
<option>Non-Vegetarian</option>
<option>Eggetarian</option>
</select>
</div>

<button onclick="calculateTargets()">Update Targets</button>

<hr style="border-color:#334155">

<h3>Targets</h3>
<div id="targets"></div>
</div>

<div class="card">
<h2>Food Logging</h2>

<div class="row">
<select id="food"></select>
<input type="number" id="qty" value="100">
<select id="unit">
<option>g</option>
<option>ml</option>
<option>piece</option>
</select>
</div>

<button onclick="addFood()">Add Food</button>

<div style="margin-top:15px;overflow:auto">
<table id="foodTable">
<thead>
<tr>
<th>Food</th>
<th>Qty</th>
<th>Unit</th>
<th>Remove</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>

</div>

<div class="grid" style="margin-top:18px">

<div class="card">
<h2>Energy Progress</h2>
<div class="progress">
<div class="progress-fill" id="energyBar"></div>
</div>
<p id="energyText"></p>
</div>

<div class="card">
<h2>Recommendations</h2>
<div id="recommendations"></div>
</div>

</div>

<div class="grid" style="margin-top:18px">

<div class="card">
<h2>Macro Chart</h2>
<canvas id="macroChart"></canvas>
</div>

<div class="card">
<h2>Deficiencies & Excesses</h2>
<h3>Top Deficiencies</h3>
<ul id="deficiencies"></ul>
<h3>Top Excesses</h3>
<ul id="excesses"></ul>
</div>

</div>

<div class="card" style="margin-top:18px">
<h2>Nutrient Dashboard</h2>
<div style="overflow:auto">
<table id="nutrientTable">
<thead>
<tr>
<th>Nutrient</th>
<th>Consumed</th>
<th>Target</th>
<th>%</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>

</div>

<script>

const foods = {
Rice:{cal:130,protein:2.7,carbs:28,fat:0.3,fiber:0.4,iron:0.2,calcium:10,vitc:0,vitd:0,b12:0},
Roti:{cal:120,protein:4,carbs:22,fat:1,fiber:3,iron:1.2,calcium:15,vitc:0,vitd:0,b12:0},
Dal:{cal:116,protein:9,carbs:20,fat:0.4,fiber:8,iron:3.3,calcium:19,vitc:1,vitd:0,b12:0},
Paneer:{cal:265,protein:18,carbs:1.2,fat:20,fiber:0,iron:0.2,calcium:208,vitc:0,vitd:0,b12:1},
Curd:{cal:98,protein:11,carbs:3.4,fat:4.3,fiber:0,iron:0.1,calcium:121,vitc:0,vitd:0,b12:0.8},
Chana:{cal:164,protein:9,carbs:27,fat:2.6,fiber:8,iron:2.9,calcium:49,vitc:1.3,vitd:0,b12:0},
Rajma:{cal:127,protein:8.7,carbs:22.8,fat:0.5,fiber:6.4,iron:2.9,calcium:28,vitc:0,b12:0,vitd:0},
Banana:{cal:89,protein:1.1,carbs:23,fat:0.3,fiber:2.6,iron:0.3,calcium:5,vitc:8.7,vitd:0,b12:0},
Apple:{cal:52,protein:0.3,carbs:14,fat:0.2,fiber:2.4,iron:0.1,calcium:6,vitc:4.6,vitd:0,b12:0},
Milk:{cal:61,protein:3.2,carbs:5,fat:3.3,fiber:0,iron:0,calcium:113,vitc:0,vitd:1,b12:0.4},
Oats:{cal:389,protein:17,carbs:66,fat:7,fiber:10.6,iron:4.7,calcium:54,vitc:0,b12:0,vitd:0},
Bread:{cal:265,protein:9,carbs:49,fat:3.2,fiber:2.7,iron:3.6,calcium:107,vitc:0,b12:0,vitd:0},
Egg:{cal:155,protein:13,carbs:1.1,fat:11,fiber:0,iron:1.8,calcium:50,vitc:0,vitd:2,b12:1.1},
Chicken:{cal:239,protein:27,carbs:0,fat:14,fiber:0,iron:1.3,calcium:15,vitc:0,vitd:0,b12:0.3},
Fish:{cal:206,protein:22,carbs:0,fat:12,fiber:0,iron:0.5,calcium:20,vitc:0,vitd:8,b12:2.4},
Potato:{cal:77,protein:2,carbs:17,fat:0.1,fiber:2.2,iron:0.8,calcium:12,vitc:19.7,vitd:0,b12:0},
Poha:{cal:130,protein:2.5,carbs:25,fat:2,fiber:1.5,iron:1.1,calcium:8,vitc:1,b12:0,vitd:0},
Idli:{cal:58,protein:2,carbs:12,fat:0.4,fiber:0.8,iron:0.3,calcium:10,vitc:0,b12:0,vitd:0},
Dosa:{cal:168,protein:4,carbs:28,fat:4,fiber:1.5,iron:1,calcium:15,vitc:0,b12:0,vitd:0},
Spinach:{cal:23,protein:2.9,carbs:3.6,fat:0.4,fiber:2.2,iron:2.7,calcium:99,vitc:28,vitd:0,b12:0}
};

const nutrients = ["cal","protein","carbs","fat","fiber","iron","calcium","vitc","vitd","b12"];

let logs = [];
let macroChart;

Object.keys(foods).forEach(f=>{
let o=document.createElement("option");
o.textContent=f;
food.appendChild(o);
});

function calculateTargets(){

let age=+document.getElementById("age").value;
let weight=+document.getElementById("weight").value;
let height=+document.getElementById("height").value;
let gender=document.getElementById("gender").value;
let activity=+document.getElementById("activity").value;

let bmr = gender==="Male"
? (10*weight)+(6.25*height)-(5*age)+5
: (10*weight)+(6.25*height)-(5*age)-161;

let calories=Math.round(bmr*activity);

window.targets={
cal:calories,
protein:Math.round(weight*1.2),
carbs:Math.round(calories*0.5/4),
fat:Math.round(calories*0.25/9),
fiber:30,
iron:18,
calcium:1000,
vitc:90,
vitd:15,
b12:2.4
};

targets.innerHTML=`
<div class="metric"><span>Calories</span><span>${targets.cal}</span></div>
<div class="metric"><span>Protein</span><span>${targets.protein}g</span></div>
<div class="metric"><span>Carbs</span><span>${targets.carbs}g</span></div>
<div class="metric"><span>Fat</span><span>${targets.fat}g</span></div>
`;

updateDashboard();
}

function addFood(){
logs.push({
food:food.value,
qty:+qty.value,
unit:unit.value
});
renderTable();
updateDashboard();
}

function renderTable(){
let tbody=document.querySelector("#foodTable tbody");
tbody.innerHTML="";
logs.forEach((x,i)=>{
tbody.innerHTML+=`
<tr>
<td contenteditable onblur="logs[${i}].food=this.innerText">${x.food}</td>
<td contenteditable onblur="logs[${i}].qty=Number(this.innerText);updateDashboard()">${x.qty}</td>
<td>${x.unit}</td>
<td><button onclick="removeFood(${i})">X</button></td>
</tr>`;
});
}

function removeFood(i){
logs.splice(i,1);
renderTable();
updateDashboard();
}

function totals(){
let t={};
nutrients.forEach(n=>t[n]=0);

logs.forEach(item=>{
let f=foods[item.food];
if(!f) return;
let factor=item.qty/100;
nutrients.forEach(n=>{
t[n]+=f[n]*factor;
});
});
return t;
}

function updateDashboard(){

if(!window.targets) return;

let total=totals();

let energyPct=Math.min(100,(total.cal/targets.cal)*100);
energyBar.style.width=energyPct+"%";
energyText.innerHTML=`${Math.round(total.cal)} / ${targets.cal} kcal (${energyPct.toFixed(1)}%)`;

let tbody=document.querySelector("#nutrientTable tbody");
tbody.innerHTML="";

let deficiency=[];
let excess=[];

const labels={
cal:"Calories",
protein:"Protein",
carbs:"Carbs",
fat:"Fat",
fiber:"Fiber",
iron:"Iron",
calcium:"Calcium",
vitc:"Vitamin C",
vitd:"Vitamin D",
b12:"Vitamin B12"
};

for(let n of nutrients){

let pct=(total[n]/targets[n])*100;
tbody.innerHTML+=`
<tr>
<td>${labels[n]}</td>
<td>${total[n].toFixed(1)}</td>
<td>${targets[n]}</td>
<td>${pct.toFixed(1)}%</td>
</tr>`;

if(pct<80) deficiency.push({n,pct});
if(pct>120) excess.push({n,pct});
}

deficiency.sort((a,b)=>a.pct-b.pct);
excess.sort((a,b)=>b.pct-a.pct);

document.getElementById("deficiencies").innerHTML=
deficiency.slice(0,3).map(x=>`<li>${labels[x.n]} (${x.pct.toFixed(0)}%)</li>`).join("");

document.getElementById("excesses").innerHTML=
excess.slice(0,3).map(x=>`<li>${labels[x.n]} (${x.pct.toFixed(0)}%)</li>`).join("");

renderRecommendations(total);
renderChart(total);
}

function renderRecommendations(total){

let diet=document.getElementById("diet").value;
let rec=[];

if(total.protein<targets.protein*0.8){
if(diet==="Vegetarian")
rec.push("➕ Add Paneer, Dal, Chana or Milk for protein.");
else if(diet==="Eggetarian")
rec.push("➕ Add Eggs, Paneer and Milk.");
else
rec.push("➕ Add Chicken, Fish or Eggs.");
}

if(total.fiber<targets.fiber*0.8)
rec.push("➕ Increase Spinach, Apple, Banana and Chana.");

if(total.iron<targets.iron*0.8)
rec.push("➕ Add Spinach, Rajma and Chana.");

if(total.cal>targets.cal*1.2)
rec.push("🔄 Reduce Rice/Roti portions by 20%.");

if(total.fat>targets.fat*1.2)
rec.push("🔄 Swap Paneer with Dal or Curd.");

if(rec.length===0)
rec.push("✅ Diet looks balanced. Maintain current portions.");

recommendations.innerHTML="<ul>"+rec.map(r=>`<li>${r}</li>`).join("")+"</ul>";
}

function renderChart(total){

let data=[
total.protein,
total.carbs,
total.fat
];

if(macroChart) macroChart.destroy();

macroChart=new Chart(document.getElementById("macroChart"),{
type:"doughnut",
data:{
labels:["Protein","Carbs","Fat"],
datasets:[{data:data}]
},
options:{
plugins:{
legend:{labels:{color:"white"}}
}
}
});
}

calculateTargets();

</script>

</body>
</html>
