<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Admission Readiness Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { 950:'#070b14', 900:'#0b1220', 850:'#0f1828', 800:'#13203a', 700:'#1c2d4d', 600:'#27406b', 500:'#34548c' },
          steel: { 400:'#7d93b8', 300:'#9fb1cf', 200:'#c2cfe6' },
          clinical: { blue:'#3b82f6', cyan:'#22d3ee', green:'#34d399', amber:'#fbbf24', red:'#f87171' }
        },
        fontFamily: {
          display: ['"IBM Plex Serif"','Georgia','serif'],
          body: ['"IBM Plex Sans"','system-ui','sans-serif'],
          mono: ['"IBM Plex Mono"','monospace']
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { background: radial-gradient(circle at 20% 0%, #101c33 0%, #070b14 55%, #050810 100%); }
  .scan-line { background-image: repeating-linear-gradient(0deg, rgba(125,147,184,0.04) 0px, rgba(125,147,184,0.04) 1px, transparent 1px, transparent 3px); }
  .badge-dot { box-shadow: 0 0 0 3px rgba(255,255,255,0.06); }
  .card { background: linear-gradient(180deg, rgba(19,32,58,0.7) 0%, rgba(11,18,32,0.7) 100%); border: 1px solid rgba(125,147,184,0.14); }
  .card:hover { border-color: rgba(125,147,184,0.28); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #1c2d4d; border-radius: 4px; }
  .fade-in { animation: fadeIn .4s ease both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
  .pulse-ring { animation: pulseRing 2.4s ease-in-out infinite; }
  @keyframes pulseRing { 0%,100% { box-shadow: 0 0 0 0 rgba(34,211,238,0.25);} 50% { box-shadow: 0 0 0 8px rgba(34,211,238,0);} }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
  .timeline-line { background: linear-gradient(180deg, #1c2d4d, transparent); }
</style>
</head>
<body class="font-body text-steel-200 min-h-screen scan-line">

<div id="app" class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12"></div>

<script>
/* ============================ DATA MODEL ============================ */
const DIAGNOSES = ["Acute MI","CHF","Pneumonia","Elective Surgery","Hip Fracture"];
const ADMISSION_TYPES = ["Inpatient","Observation","Emergency","ICU","Same-Day Surgery"];
const PA_STATUSES = ["Approved","Pending","Denied"];

const WEIGHTS = { pa:0.25, documentation:0.20, orders:0.20, insurance:0.15, consent:0.10, bed:0.10 };
const FRACTIONS = {
  pa: { approved:1, pending:0.4, denied:0.1 },
  insurance: { verified:1, pending:0.5, issue:0.2 },
  bed: { assigned:1, pending:0.4 },
  documentation: { complete:1, partial:0.5, missing:0.1 },
  orders: { signed:1, pending:0.4, missing:0.1 },
  consent: { signed:1, pending:0.3 }
};

const TIMELINE_STEPS = [
  { key:'pa', label:'PA Review' },
  { key:'insurance', label:'Insurance Verification' },
  { key:'bed', label:'Bed Assignment' },
  { key:'documentation', label:'Documentation' },
  { key:'consent', label:'Consent' },
  { key:'arrival', label:'Patient Arrival' },
  { key:'registration', label:'Registration' },
  { key:'clinical_assessment', label:'Clinical Assessment' },
  { key:'admission_complete', label:'Admission Complete' }
];

let state = null;
let setup = {
  provider: '', attending: '', diagnosis: DIAGNOSES[0], admissionType: ADMISSION_TYPES[0],
  paStatusInitial: PA_STATUSES[1], admissionDate: ''
};

function freshState() {
  // initial sub-statuses seeded so total score lands 30-60%
  let pa = setup.paStatusInitial.toLowerCase();
  let s = {
    pa: { status: pa, appealEligible:false, reasonShown:false, log:[] },
    insurance: { status:'pending' },
    bed: { status:'pending' },
    documentation: { status:'missing' },
    orders: { status:'missing' },
    consent: { status:'pending' },
    timeline: {},
    actionLog: [],
    finalized: false
  };
  // mark PA timeline as 'in progress' always at start
  return s;
}

function fraction(item, status) { return FRACTIONS[item][status]; }

function computeScore() {
  let total = 0;
  total += fraction('pa', state.pa.status) * WEIGHTS.pa;
  total += fraction('insurance', state.insurance.status) * WEIGHTS.insurance;
  total += fraction('bed', state.bed.status) * WEIGHTS.bed;
  total += fraction('documentation', state.documentation.status) * WEIGHTS.documentation;
  total += fraction('orders', state.orders.status) * WEIGHTS.orders;
  total += fraction('consent', state.consent.status) * WEIGHTS.consent;
  let pct = Math.round(total * 100);
  if (state.pa.status === 'denied' && setup.admissionType === 'ICU') {
    pct = Math.min(pct, 69);
  }
  return pct;
}

function isHighAcuity() {
  return ['Acute MI','CHF'].includes(setup.diagnosis) || setup.admissionType === 'ICU';
}

function clinicalRisk() {
  if (!isHighAcuity()) {
    return state.documentation.status === 'missing' || state.orders.status === 'missing' ? 'Medium' : 'Low';
  }
  if (state.pa.status === 'denied') return 'High';
  if (state.documentation.status === 'complete' && state.orders.status === 'signed') return 'Medium';
  return 'High';
}

function riskLabel(item) {
  const map = {
    documentation: { complete:'Low', partial:'Medium', missing:'High' },
    insurance: { verified:'Low', pending:'Medium', issue:'High' },
    bed: { assigned:'Low', pending:'Medium' }
  };
  return map[item][state[item].status];
}

/* ============================ RENDER HELPERS ============================ */
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function root() { return document.getElementById('app'); }

function riskColor(level) {
  return level === 'Low' ? 'text-clinical-green border-clinical-green/30 bg-clinical-green/10'
    : level === 'Medium' ? 'text-clinical-amber border-clinical-amber/30 bg-clinical-amber/10'
    : 'text-clinical-red border-clinical-red/30 bg-clinical-red/10';
}

function statusBadge(label, tone) {
  const tones = {
    green: 'text-clinical-green border-clinical-green/30 bg-clinical-green/10',
    amber: 'text-clinical-amber border-clinical-amber/30 bg-clinical-amber/10',
    red: 'text-clinical-red border-clinical-red/30 bg-clinical-red/10',
    blue: 'text-clinical-cyan border-clinical-cyan/30 bg-clinical-cyan/10'
  };
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs font-mono font-medium ${tones[tone]}">
    <span class="w-1.5 h-1.5 rounded-full badge-dot bg-current"></span>${label}</span>`;
}

function itemToneStatus(item, status) {
  const goodMap = { pa:'approved', insurance:'verified', bed:'assigned', documentation:'complete', orders:'signed', consent:'signed' };
  const badMap = { pa:'denied', insurance:'issue', documentation:'missing', orders:'missing' };
  if (status === goodMap[item]) return 'green';
  if (status === badMap[item]) return 'red';
  return 'amber';
}

function labelStatus(item, status) {
  const labels = {
    pa: { approved:'Approved', pending:'Pending', denied:'Denied' },
    insurance: { verified:'Verified', pending:'Pending', issue:'Issue Flagged' },
    bed: { assigned:'Assigned', pending:'Pending' },
    documentation: { complete:'Complete', partial:'Partial', missing:'Missing' },
    orders: { signed:'Signed', pending:'Pending', missing:'Missing' },
    consent: { signed:'Signed', pending:'Pending' }
  };
  return labels[item][status];
}

/* ============================ SCREENS ============================ */
function renderHeader(subtitle) {
  return `
  <div class="mb-8 fade-in">
    <div class="flex items-center gap-2.5 mb-1">
      <span class="text-clinical-cyan text-xl">🏥</span>
      <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400">Admission Coordination Console</p>
    </div>
    <h1 class="font-display text-2xl sm:text-3xl text-steel-200 font-semibold tracking-tight">Hospital Admission Readiness Simulator</h1>
    ${subtitle ? `<p class="mt-1.5 text-sm text-steel-400 max-w-2xl">${subtitle}</p>` : ''}
  </div>`;
}

function renderSetup() {
  root().innerHTML = `
    ${renderHeader('Enter case details to begin the admission readiness workflow. All provider and payer names below are illustrative training data.')}
    <div class="card rounded-2xl p-5 sm:p-7 fade-in">
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs font-mono uppercase tracking-wider text-steel-400 mb-1.5">Provider <span class="text-steel-400/60 normal-case font-sans">(illustrative)</span></label>
          <input id="f-provider" type="text" placeholder="e.g. Meridian Health Network" class="w-full bg-navy-900/70 border border-navy-600 rounded-lg px-3.5 py-2.5 text-sm text-steel-200 placeholder-steel-400/40 focus:outline-none focus:ring-2 focus:ring-clinical-cyan/40 focus:border-clinical-cyan/40"/>
        </div>
        <div>
          <label class="block text-xs font-mono uppercase tracking-wider text-steel-400 mb-1.5">Attending Physician <span class="text-steel-400/60 normal-case font-sans">(illustrative)</span></label>
          <input id="f-attending" type="text" placeholder="e.g. Dr. R. Okafor" class="w-full bg-navy-900/70 border border-navy-600 rounded-lg px-3.5 py-2.5 text-sm text-steel-200 placeholder-steel-400/40 focus:outline-none focus:ring-2 focus:ring-clinical-cyan/40 focus:border-clinical-cyan/40"/>
        </div>
        <div>
          <label class="block text-xs font-mono uppercase tracking-wider text-steel-400 mb-1.5">Diagnosis</label>
          <select id="f-diagnosis" class="w-full bg-navy-900/70 border border-navy-600 rounded-lg px-3.5 py-2.5 text-sm text-steel-200 focus:outline-none focus:ring-2 focus:ring-clinical-cyan/40">
            ${DIAGNOSES.map(d => `<option value="${d}">${d}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs font-mono uppercase tracking-wider text-steel-400 mb-1.5">Admission Type</label>
          <select id="f-admtype" class="w-full bg-navy-900/70 border border-navy-600 rounded-lg px-3.5 py-2.5 text-sm text-steel-200 focus:outline-none focus:ring-2 focus:ring-clinical-cyan/40">
            ${ADMISSION_TYPES.map(d => `<option value="${d}">${d}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs font-mono uppercase tracking-wider text-steel-400 mb-1.5">PA Status</label>
          <select id="f-pastatus" class="w-full bg-navy-900/70 border border-navy-600 rounded-lg px-3.5 py-2.5 text-sm text-steel-200 focus:outline-none focus:ring-2 focus:ring-clinical-cyan/40">
            ${PA_STATUSES.map(d => `<option value="${d}">${d}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs font-mono uppercase tracking-wider text-steel-400 mb-1.5">Admission Date</label>
          <input id="f-date" type="date" class="w-full bg-navy-900/70 border border-navy-600 rounded-lg px-3.5 py-2.5 text-sm text-steel-200 focus:outline-none focus:ring-2 focus:ring-clinical-cyan/40"/>
        </div>
      </div>

      <div id="obs-banner" class="hidden mt-5 rounded-xl border border-clinical-amber/30 bg-clinical-amber/10 px-4 py-3 text-xs text-clinical-amber leading-relaxed">
        <span class="font-mono uppercase tracking-wider font-semibold">⚠ CMS 2-Midnight Rule</span> applies — different cost-sharing, SNF eligibility, and billing than inpatient. Medicare patients require written MOON notification.
      </div>

      <div class="mt-7 flex justify-end">
        <button id="btn-analyze" class="inline-flex items-center gap-2 bg-clinical-cyan/90 hover:bg-clinical-cyan text-navy-950 font-semibold text-sm px-5 py-2.5 rounded-lg transition shadow-lg shadow-clinical-cyan/10">
          🏥 Analyze Admission Readiness
        </button>
      </div>
    </div>
  `;

  const admType = document.getElementById('f-admtype');
  const obsBanner = document.getElementById('obs-banner');
  admType.addEventListener('change', () => {
    obsBanner.classList.toggle('hidden', admType.value !== 'Observation');
  });

  document.getElementById('btn-analyze').addEventListener('click', () => {
    setup.provider = document.getElementById('f-provider').value || 'Meridian Health Network (illustrative)';
    setup.attending = document.getElementById('f-attending').value || 'Dr. R. Okafor (illustrative)';
    setup.diagnosis = document.getElementById('f-diagnosis').value;
    setup.admissionType = admType.value;
    setup.paStatusInitial = document.getElementById('f-pastatus').value;
    setup.admissionDate = document.getElementById('f-date').value || '—';

    state = freshState();
    state.actionLog.push('Case intake completed. Initial readiness analysis generated.');
    renderConsole();
  });
}

/* ============================ CONSOLE (MAIN WORKSPACE) ============================ */
function renderConsole() {
  const score = computeScore();
  root().innerHTML = `
    ${renderHeader(null)}
    ${renderCaseBar()}
    ${setup.admissionType === 'Observation' ? renderObsBanner() : ''}
    ${isHighAcuity() ? renderCriteriaNote() : ''}

    <div class="grid lg:grid-cols-3 gap-5 mt-5">
      <div class="lg:col-span-2 space-y-5">
        ${renderScoreCard(score)}
        ${renderStatusGrid()}
        ${renderPaPanel()}
        ${renderWorkflowActions()}
        ${score >= 75 ? renderGovernanceSnapshot() : ''}
        ${renderFinalizeBlock(score)}
      </div>
      <div class="space-y-5">
        ${renderTimeline()}
        ${renderRiskTracking()}
        ${renderCareCoordination()}
        ${renderActionLog()}
      </div>
    </div>
  `;
  attachConsoleHandlers();
}

function renderCaseBar() {
  return `
  <div class="card rounded-xl px-5 py-4 fade-in flex flex-wrap gap-x-8 gap-y-2 text-xs">
    <div><span class="text-steel-400 font-mono uppercase tracking-wider">Provider</span><br><span class="text-steel-200">${setup.provider}</span></div>
    <div><span class="text-steel-400 font-mono uppercase tracking-wider">Attending</span><br><span class="text-steel-200">${setup.attending}</span></div>
    <div><span class="text-steel-400 font-mono uppercase tracking-wider">Diagnosis</span><br><span class="text-steel-200">${setup.diagnosis}</span></div>
    <div><span class="text-steel-400 font-mono uppercase tracking-wider">Admission Type</span><br><span class="text-steel-200">${setup.admissionType}</span></div>
    <div><span class="text-steel-400 font-mono uppercase tracking-wider">Admission Date</span><br><span class="text-steel-200">${setup.admissionDate}</span></div>
    <p class="w-full text-[10px] text-steel-400/50 mt-1">Provider and physician names are illustrative training data, not real entities.</p>
  </div>`;
}

function renderObsBanner() {
  return `
  <div class="mt-5 rounded-xl border border-clinical-amber/30 bg-clinical-amber/10 px-4 py-3 text-xs text-clinical-amber leading-relaxed fade-in">
    <span class="font-mono uppercase tracking-wider font-semibold">⚠ CMS 2-Midnight Rule</span> applies — different cost-sharing, SNF eligibility, and billing than inpatient. Medicare patients require written MOON notification.
  </div>`;
}

function renderCriteriaNote() {
  return `
  <div class="mt-5 rounded-xl border border-clinical-cyan/25 bg-clinical-cyan/5 px-4 py-3 text-xs text-clinical-cyan/90 leading-relaxed fade-in">
    <span class="font-mono uppercase tracking-wider font-semibold">📋 Medical Necessity Criteria</span> — InterQual/Milliman thresholds apply — ensure documentation meets medical necessity standards before UR review.
  </div>`;
}

function renderScoreCard(score) {
  const tone = score >= 90 ? 'green' : score >= 75 ? 'blue' : score >= 50 ? 'amber' : 'red';
  const toneColor = { green:'#34d399', blue:'#22d3ee', amber:'#fbbf24', red:'#f87171' }[tone];
  return `
  <div class="card rounded-2xl p-5 sm:p-6 fade-in">
    <div class="flex items-center justify-between mb-4">
      <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400">Readiness Score</p>
      <span class="text-[10px] font-mono text-steel-400">Live — recalculates with each action</span>
    </div>
    <div class="flex items-center gap-6">
      <div class="relative w-28 h-28 shrink-0">
        <svg viewBox="0 0 120 120" class="w-28 h-28 -rotate-90">
          <circle cx="60" cy="60" r="52" stroke="#1c2d4d" stroke-width="10" fill="none"/>
          <circle cx="60" cy="60" r="52" stroke="${toneColor}" stroke-width="10" fill="none"
            stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52*(1-score/100)}" stroke-linecap="round"/>
        </svg>
        <div class="absolute inset-0 flex items-center justify-center flex-col">
          <span class="font-display text-2xl font-semibold text-steel-100">${score}%</span>
        </div>
      </div>
      <div class="flex-1 space-y-1.5 text-xs">
        ${weightRow('PA Status', WEIGHTS.pa, fraction('pa', state.pa.status))}
        ${weightRow('Clinical Documentation', WEIGHTS.documentation, fraction('documentation', state.documentation.status))}
        ${weightRow('Physician Orders', WEIGHTS.orders, fraction('orders', state.orders.status))}
        ${weightRow('Insurance', WEIGHTS.insurance, fraction('insurance', state.insurance.status))}
        ${weightRow('Consent', WEIGHTS.consent, fraction('consent', state.consent.status))}
        ${weightRow('Bed', WEIGHTS.bed, fraction('bed', state.bed.status))}
      </div>
    </div>
    ${state.pa.status === 'denied' && setup.admissionType === 'ICU' ? `
      <p class="mt-4 text-[11px] text-clinical-red bg-clinical-red/10 border border-clinical-red/25 rounded-lg px-3 py-2">
        Score capped at 69% — a denied PA on an ICU admission cannot reach readiness from administrative tasks alone. Appeal or PA reversal required.
      </p>` : ''}
  </div>`;
}

function weightRow(label, weight, frac) {
  const pct = Math.round(frac * 100);
  const barColor = frac >= 0.9 ? 'bg-clinical-green' : frac >= 0.45 ? 'bg-clinical-amber' : 'bg-clinical-red';
  return `
  <div>
    <div class="flex justify-between text-steel-400 mb-0.5"><span>${label} <span class="text-steel-400/50">(${Math.round(weight*100)}%)</span></span><span class="text-steel-300 font-mono">${pct}%</span></div>
    <div class="h-1.5 w-full bg-navy-700 rounded-full overflow-hidden"><div class="${barColor} h-full rounded-full transition-all" style="width:${pct}%"></div></div>
  </div>`;
}

function renderStatusGrid() {
  const items = [
    { key:'pa', label:'PA' },
    { key:'insurance', label:'Insurance' },
    { key:'bed', label:'Bed' },
    { key:'documentation', label:'Documentation' },
    { key:'orders', label:'Physician Orders' },
    { key:'consent', label:'Consent' }
  ];
  return `
  <div class="card rounded-2xl p-5 sm:p-6 fade-in">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400 mb-4">Initial Analysis — Status Board</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      ${items.map(it => `
        <div class="rounded-xl border border-navy-600/60 bg-navy-900/50 px-3.5 py-3">
          <p class="text-[10px] font-mono uppercase tracking-wider text-steel-400 mb-1.5">${it.label}</p>
          ${statusBadge(labelStatus(it.key, state[it.key].status), itemToneStatus(it.key, state[it.key].status))}
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderPaPanel() {
  let body = '';
  if (state.pa.status === 'approved') {
    body = `<p class="text-xs text-clinical-green">✓ Prior authorization approved. No further PA action required.</p>`;
  } else if (state.pa.status === 'pending') {
    body = `
      <p class="text-xs text-steel-400 mb-3">PA is pending payer determination. Available actions:</p>
      <div class="flex flex-wrap gap-2">
        <button data-pa-action="followup" class="pa-btn px-3 py-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-xs text-steel-200 border border-navy-600 transition">Follow Up</button>
        <button data-pa-action="uploaddocs" class="pa-btn px-3 py-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-xs text-steel-200 border border-navy-600 transition">Upload Docs</button>
        <button data-pa-action="contactphys" class="pa-btn px-3 py-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-xs text-steel-200 border border-navy-600 transition">Contact Physician</button>
      </div>`;
  } else if (state.pa.status === 'denied') {
    body = `
      <p class="text-xs text-clinical-red mb-3">Prior authorization denied. Review and appeal options below.</p>
      ${state.pa.reasonShown ? `<div class="text-[11px] text-steel-300 bg-navy-900/60 border border-navy-600 rounded-lg px-3 py-2 mb-3 font-mono">Denial reason (illustrative): "Medical necessity not established at time of submission — InterQual criteria not yet met in documentation."</div>` : ''}
      <div class="flex flex-wrap gap-2">
        <button data-pa-action="reviewreason" class="pa-btn px-3 py-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-xs text-steel-200 border border-navy-600 transition">Review Reason</button>
        <button data-pa-action="contactins" class="pa-btn px-3 py-1.5 rounded-lg bg-navy-700 hover:bg-navy-600 text-xs text-steel-200 border border-navy-600 transition">Contact Insurance</button>
        <button data-pa-action="appeal" ${state.pa.appealEligible ? '' : 'disabled'} class="pa-btn px-3 py-1.5 rounded-lg ${state.pa.appealEligible ? 'bg-clinical-cyan/90 hover:bg-clinical-cyan text-navy-950' : 'bg-navy-800 text-steel-400/50 cursor-not-allowed border border-navy-700'} text-xs font-medium transition">Submit Appeal</button>
      </div>
      ${!state.pa.appealEligible ? `<p class="text-[10px] text-steel-400/60 mt-2">Contact Insurance to unlock the appeal submission.</p>` : ''}`;
  }
  return `
  <div class="card rounded-2xl p-5 sm:p-6 fade-in">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400 mb-3">Prior Authorization Branch</p>
    ${body}
  </div>`;
}

function renderWorkflowActions() {
  const actions = [
    { key:'bed', label:'Assign Bed', disabled: state.bed.status === 'assigned' },
    { key:'insurance', label:'Verify Insurance', disabled: state.insurance.status === 'verified' },
    { key:'documentation', label:'Upload Documentation', disabled: state.documentation.status === 'complete' },
    { key:'consent', label:'Complete Consent', disabled: state.consent.status === 'signed' },
    { key:'orders', label:'Contact Physician', disabled: state.orders.status === 'signed' },
    { key:'nursing', label:'Notify Nursing', disabled: !!state.timeline.nursing_notified },
    { key:'arrival', label:'Prepare Patient Arrival', disabled: !(state.bed.status==='assigned' && state.consent.status==='signed' && state.orders.status==='signed') || !!state.timeline.arrival }
  ];
  return `
  <div class="card rounded-2xl p-5 sm:p-6 fade-in">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400 mb-4">Workflow Actions</p>
    <div class="flex flex-wrap gap-2">
      ${actions.map(a => `
        <button data-wf-action="${a.key}" ${a.disabled ? 'disabled' : ''}
          class="wf-btn px-3.5 py-2 rounded-lg text-xs font-medium border transition
          ${a.disabled ? 'bg-navy-800 text-steel-400/40 border-navy-700 cursor-not-allowed' : 'bg-navy-700 hover:bg-navy-600 text-steel-200 border-navy-600'}">
          ${a.label}${a.disabled ? ' ✓' : ''}
        </button>
      `).join('')}
    </div>
  </div>`;
}

function renderGovernanceSnapshot() {
  return `
  <div class="card rounded-2xl p-5 sm:p-6 fade-in border-clinical-cyan/20">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-clinical-cyan mb-3">📊 Governance Snapshot</p>
    <p class="text-xs text-steel-300 leading-relaxed mb-2">Industry benchmarks (estimates only):</p>
    <ul class="text-xs text-steel-300 space-y-1 font-mono">
      <li>· PA turnaround: 3–5 days</li>
      <li>· Inpatient denial rate: ~8–10% (CMS)</li>
      <li>· PA rework cost: ~$11/transaction (CAQH)</li>
    </ul>
  </div>`;
}

function renderFinalizeBlock(score) {
  if (state.finalized) {
    return renderFinalDecision(score);
  }
  return `
  <div class="card rounded-2xl p-5 sm:p-6 fade-in flex items-center justify-between flex-wrap gap-3">
    <p class="text-xs text-steel-400 max-w-md">Complete workflow actions to raise readiness, then finalize the admission decision. Final admission requires ≥ 90% readiness.</p>
    <button id="btn-finalize" class="px-5 py-2.5 rounded-lg bg-clinical-cyan/90 hover:bg-clinical-cyan text-navy-950 text-sm font-semibold transition shrink-0">Finalize Admission Decision</button>
  </div>`;
}

function renderFinalDecision(score) {
  if (score >= 90) {
    return `
    <div class="card rounded-2xl p-5 sm:p-6 fade-in border-clinical-green/30">
      <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-clinical-green mb-2">✅ Admit</p>
      <h3 class="font-display text-xl text-steel-100 mb-3">Admission Approved for Processing</h3>
      <div class="grid sm:grid-cols-2 gap-x-6 gap-y-1.5 text-xs text-steel-300 mb-4">
        <p><span class="text-steel-400">Provider:</span> ${setup.provider}</p>
        <p><span class="text-steel-400">Attending:</span> ${setup.attending}</p>
        <p><span class="text-steel-400">Diagnosis:</span> ${setup.diagnosis}</p>
        <p><span class="text-steel-400">Admission Type:</span> ${setup.admissionType}</p>
        <p><span class="text-steel-400">Admission Date:</span> ${setup.admissionDate}</p>
        <p><span class="text-steel-400">Final Readiness:</span> ${score}%</p>
      </div>
      <p class="text-xs text-steel-400 leading-relaxed">All required readiness elements — PA, insurance, bed, documentation, physician orders, and consent — are at or above acceptable thresholds. Proceed to registration and clinical assessment per standard intake protocol.</p>
    </div>`;
  }
  const missing = [];
  if (fraction('pa', state.pa.status) < 1) missing.push('Prior authorization not fully approved');
  if (fraction('insurance', state.insurance.status) < 1) missing.push('Insurance verification incomplete');
  if (fraction('bed', state.bed.status) < 1) missing.push('Bed not yet assigned');
  if (fraction('documentation', state.documentation.status) < 1) missing.push('Clinical documentation incomplete');
  if (fraction('orders', state.orders.status) < 1) missing.push('Physician orders not signed');
  if (fraction('consent', state.consent.status) < 1) missing.push('Consent not signed');

  return `
  <div class="card rounded-2xl p-5 sm:p-6 fade-in border-clinical-amber/30">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-clinical-amber mb-2">⚠ Not Ready</p>
    <h3 class="font-display text-xl text-steel-100 mb-3">Readiness at ${score}% — Below 90% Admission Threshold</h3>
    <p class="text-xs text-steel-400 mb-3">Missing items:</p>
    <ul class="text-xs text-steel-300 space-y-1 mb-4">
      ${missing.length ? missing.map(m => `<li>· ${m}</li>`).join('') : '<li>· None — close to threshold, continue monitoring.</li>'}
    </ul>
    <p class="text-xs text-steel-400 mb-3">Required actions: resolve outstanding items above via the Workflow Actions and Prior Authorization Branch panels, then re-finalize.</p>
    <p class="text-xs text-steel-400">Remaining clinical risk: <span class="font-mono ${clinicalRisk()==='High' ? 'text-clinical-red' : clinicalRisk()==='Medium' ? 'text-clinical-amber' : 'text-clinical-green'}">${clinicalRisk()}</span></p>
    <button id="btn-revise" class="mt-4 px-4 py-2 rounded-lg bg-navy-700 hover:bg-navy-600 text-xs text-steel-200 border border-navy-600 transition">Return to Workflow</button>
  </div>`;
}

function renderTimeline() {
  return `
  <div class="card rounded-2xl p-5 fade-in">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400 mb-4">Admission Timeline</p>
    <div class="relative pl-5">
      <div class="absolute left-[7px] top-1 bottom-1 w-px timeline-line"></div>
      ${TIMELINE_STEPS.map(step => {
        const done = isTimelineDone(step.key);
        return `
        <div class="relative mb-4 last:mb-0">
          <span class="absolute -left-5 top-0.5 w-3 h-3 rounded-full border-2 ${done ? 'bg-clinical-cyan border-clinical-cyan' : 'bg-navy-900 border-navy-600'}"></span>
          <p class="text-xs ${done ? 'text-steel-200' : 'text-steel-400/60'}">${step.label}</p>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function isTimelineDone(key) {
  switch(key) {
    case 'pa': return state.pa.status === 'approved';
    case 'insurance': return state.insurance.status === 'verified';
    case 'bed': return state.bed.status === 'assigned';
    case 'documentation': return state.documentation.status === 'complete';
    case 'consent': return state.consent.status === 'signed';
    case 'arrival': return !!state.timeline.arrival;
    case 'registration': return !!state.timeline.arrival;
    case 'clinical_assessment': return !!state.timeline.arrival && state.orders.status === 'signed';
    case 'admission_complete': return state.finalized && computeScore() >= 90;
    default: return false;
  }
}

function renderRiskTracking() {
  const cr = clinicalRisk();
  return `
  <div class="card rounded-2xl p-5 fade-in">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400 mb-4">Risk Tracking</p>
    <div class="space-y-2.5">
      ${riskRow('Documentation Risk', riskLabel('documentation'))}
      ${riskRow('Insurance Risk', riskLabel('insurance'))}
      ${riskRow('Bed Risk', riskLabel('bed'))}
      ${riskRow('Clinical Risk', cr, isHighAcuity())}
    </div>
    ${isHighAcuity() ? `<p class="text-[10px] text-steel-400/60 mt-3">Clinical Risk weighted higher due to ${setup.diagnosis === 'Acute MI' || setup.diagnosis === 'CHF' ? setup.diagnosis : 'ICU'} acuity.</p>` : ''}
  </div>`;
}

function riskRow(label, level, emphasized) {
  return `
  <div class="flex items-center justify-between">
    <span class="text-xs text-steel-300">${label}${emphasized ? ' <span class=\"text-clinical-cyan\">↑</span>' : ''}</span>
    <span class="text-[11px] font-mono px-2 py-0.5 rounded-full border ${riskColor(level)}">${level}</span>
  </div>`;
}

function renderCareCoordination() {
  const cards = [
    { role:'Attending', name: setup.attending, note:'Oversees clinical decision-making and signs physician orders for admission.' },
    { role:'Case Manager', name:'J. Alvarez, CM (illustrative)', note:'Coordinates bed placement, payer communication, and discharge planning timeline.' },
    { role:'Nursing', name:'Unit 4B Charge Nurse (illustrative)', note:'Prepares for patient arrival and confirms bed readiness on the floor.' },
    { role:'Utilization Review', name:'UR Department (illustrative)', note:'Conducts concurrent review and denial risk identification using InterQual and Milliman criteria.' },
    { role:'Discharge Planner', name:'T. Singh, LSW (illustrative)', note:'Begins discharge planning at admission to align length-of-stay expectations.' }
  ];
  return `
  <div class="card rounded-2xl p-5 fade-in">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400 mb-4">Care Coordination</p>
    <div class="space-y-3">
      ${cards.map(c => `
        <div class="border-l-2 border-navy-600 pl-3">
          <p class="text-[10px] font-mono uppercase tracking-wider text-clinical-cyan">${c.role}</p>
          <p class="text-xs text-steel-200">${c.name}</p>
          <p class="text-[11px] text-steel-400 mt-0.5 leading-snug">${c.note}</p>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderActionLog() {
  return `
  <div class="card rounded-2xl p-5 fade-in">
    <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-steel-400 mb-3">Action Log</p>
    <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
      ${state.actionLog.slice().reverse().map(a => `<p class="text-[11px] text-steel-400 font-mono leading-relaxed">› ${a}</p>`).join('')}
    </div>
  </div>`;
}

/* ============================ HANDLERS ============================ */
function attachConsoleHandlers() {
  document.querySelectorAll('.pa-btn').forEach(btn => {
    btn.addEventListener('click', () => handlePaAction(btn.dataset.paAction));
  });
  document.querySelectorAll('.wf-btn').forEach(btn => {
    btn.addEventListener('click', () => handleWfAction(btn.dataset.wfAction));
  });
  const finBtn = document.getElementById('btn-finalize');
  if (finBtn) finBtn.addEventListener('click', () => { state.finalized = true; state.actionLog.push(`Admission decision finalized at ${computeScore()}% readiness.`); renderConsole(); });
  const revBtn = document.getElementById('btn-revise');
  if (revBtn) revBtn.addEventListener('click', () => { state.finalized = false; renderConsole(); });
}

function handlePaAction(action) {
  if (action === 'followup') {
    state.pa.status = 'approved';
    state.actionLog.push('Followed up with payer — PA status resolved to Approved.');
  } else if (action === 'uploaddocs') {
    if (state.documentation.status === 'missing') state.documentation.status = 'partial';
    else if (state.documentation.status === 'partial') state.documentation.status = 'complete';
    state.actionLog.push('Uploaded supporting documentation in support of pending PA.');
  } else if (action === 'contactphys') {
    if (state.orders.status === 'missing') state.orders.status = 'pending';
    else if (state.orders.status === 'pending') state.orders.status = 'signed';
    state.actionLog.push('Contacted physician regarding pending PA — orders advanced.');
  } else if (action === 'reviewreason') {
    state.pa.reasonShown = true;
    state.actionLog.push('Reviewed PA denial reason.');
  } else if (action === 'contactins') {
    state.pa.appealEligible = true;
    state.actionLog.push('Contacted insurance regarding denial — appeal submission unlocked.');
  } else if (action === 'appeal') {
    if (state.pa.appealEligible) {
      state.pa.status = 'approved';
      state.actionLog.push('Appeal submitted and successful — PA status converted to Approved.');
    }
  }
  renderConsole();
}

function handleWfAction(key) {
  if (key === 'bed') { state.bed.status = 'assigned'; state.actionLog.push('Bed assigned.'); }
  else if (key === 'insurance') { state.insurance.status = 'verified'; state.actionLog.push('Insurance verified.'); }
  else if (key === 'documentation') {
    if (state.documentation.status === 'missing') state.documentation.status = 'partial';
    else if (state.documentation.status === 'partial') state.documentation.status = 'complete';
    state.actionLog.push('Documentation uploaded.');
  }
  else if (key === 'consent') { state.consent.status = 'signed'; state.actionLog.push('Consent completed.'); }
  else if (key === 'orders') {
    if (state.orders.status === 'missing') state.orders.status = 'pending';
    else if (state.orders.status === 'pending') state.orders.status = 'signed';
    state.actionLog.push('Physician contacted regarding orders.');
  }
  else if (key === 'nursing') { state.timeline.nursing_notified = true; state.actionLog.push('Nursing notified of incoming admission.'); }
  else if (key === 'arrival') { state.timeline.arrival = true; state.actionLog.push('Patient arrival prepared — registration and clinical assessment underway.'); }
  renderConsole();
}

/* ============================ INIT ============================ */
renderSetup();
</script>
</body>
</html>
